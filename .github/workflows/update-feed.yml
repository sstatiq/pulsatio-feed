name: Update radio feed

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture feed
        run: python3 capture_radio_feed.py radio.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- radio.json; then
            echo "No membership changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio.json
          git commit -m "Update radio feed"
          git push
